name: 更新類股輪動資料

# 台股收盤 13:30、證交所資料約 18:00 前齊全（UTC+8）
# 美股收盤後隔天早上再更新一次
on:
  schedule:
    - cron: "30 11 * * 1-5"   # UTC 11:30 = 台北 19:30，平日
  workflow_dispatch:           # 也可以在 GitHub 網頁上手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        # requirements.txt 刻意放在 scripts/ 而不是根目錄：
        # 放根目錄會讓 Vercel 把這個專案誤判成 Python 應用，去找 app.py 然後建置失敗
        run: pip install -r scripts/requirements.txt

      - name: 抓取全市場快照
        run: python scripts/fetch.py

      - name: 補齊類股指數歷史
        # 歷史序列已經在 repo 裡，這裡只會補新的交易日
        run: python scripts/backfill.py --days 30

      - name: 抓取三大法人
        run: python scripts/chips.py --days 20

      - name: 更新歷史季報
        # 水準型指標要跟自己的歷史比，所以要維護一份長期序列。
        # 已下載的季度會沿用快取，每天只會實際抓新公布的那一季。
        run: python scripts/hist_fin.py --quarters 34

      - name: 更新歷史估值
        run: python scripts/hist_val.py --months 96

      - name: 計算台股分數
        run: python scripts/build.py

      - name: 計算美股分數
        run: |
          python scripts/hist_us.py --quarters 32
          python scripts/build_us.py

      - name: 驗證資料
        # 跨來源對帳、不變量、時效性、連續性、覆蓋率。
        # 這一步失敗會讓整個 workflow 中斷，錯誤的資料就不會被 commit 上去。
        run: python scripts/verify.py
        continue-on-error: true   # SEC 或 Yahoo 掛掉不該讓台股也更新失敗

      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data data/history
          if git diff --staged --quiet; then
            echo "資料沒有變動，不提交"
          else
            git commit -m "自動更新資料 $(date -u +'%Y-%m-%d')"
            git push
          fi
